<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOCFL A1 Mandarin Academic Module</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-cyan: #06b6d4;
      --accent-purple: #8b5cf6;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
      --border-glow: rgba(6, 182, 212, 0.3);
      --success: #10b981;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg-dark) 70%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      color: var(--text-main);
    }

    .dashboard-container {
      width: 100%;
      max-width: 460px;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    /* Top Bar Header */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--accent-cyan);
      text-transform: uppercase;
    }

    .mode-pills {
      display: flex;
      gap: 6px;
      background: rgba(15, 23, 42, 0.6);
      padding: 4px;
      border-radius: 30px;
    }

    .pill-btn {
      padding: 6px 14px;
      border: none;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      background: transparent;
      cursor: pointer;
      transition: all 0.3s;
    }

    .pill-btn.active {
      background: var(--accent-cyan);
      color: #0f172a;
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.4);
    }

    /* Progress Bar */
    .progress-box {
      margin-bottom: 20px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 5%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
      transition: width 0.3s ease;
    }

    /* Flashcard Screen */
    .fc-screen {
      display: block;
    }

    .main-card {
      width: 100%;
      height: 250px;
      perspective: 1000px;
      margin-bottom: 20px;
      cursor: pointer;
    }

    .card-3d {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border-radius: 16px;
    }

    .card-3d.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      border: 1px solid var(--border-glow);
      box-shadow: inset 0 0 20px rgba(6, 182, 212, 0.05);
    }

    .card-front {
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
    }

    .card-back {
      background: radial-gradient(circle at center, #2e1065 0%, #0f172a 100%);
      transform: rotateY(180deg);
      border-color: rgba(139, 92, 246, 0.4);
    }

    .hanzi-display {
      font-size: 72px;
      font-weight: 800;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tap-text {
      margin-top: 15px;
      font-size: 11px;
      color: var(--accent-cyan);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .pinyin-display {
      font-size: 26px;
      font-weight: 700;
      color: #a7f3d0;
      margin-bottom: 8px;
    }

    .meaning-display {
      font-size: 15px;
      color: var(--text-main);
      text-align: center;
    }

    /* Control Buttons */
    .controls-row {
      display: flex;
      gap: 10px;
    }

    .btn-nav {
      flex: 1;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(15, 23, 42, 0.8);
      color: var(--text-main);
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-nav:hover {
      background: var(--accent-cyan);
      color: #0f172a;
      border-color: var(--accent-cyan);
    }

    /* Quiz Screen */
    .qz-screen {
      display: none;
    }

    .qz-question-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      margin-bottom: 16px;
    }

    .qz-hanzi {
      font-size: 54px;
      font-weight: 700;
      color: #ffffff;
    }

    .qz-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .qz-option-btn {
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(30, 41, 59, 0.8);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 14px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
    }

    .qz-option-btn:hover {
      border-color: var(--accent-purple);
      background: rgba(139, 92, 246, 0.15);
    }

    .qz-option-btn.correct {
      background: rgba(16, 185, 129, 0.2);
      border-color: var(--success);
      color: #6ee7b7;
    }

    .qz-option-btn.wrong {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--error);
      color: #fca5a5;
    }

    .summary-card {
      text-align: center;
      padding: 30px 10px;
    }

    .summary-score {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent-cyan);
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    <!-- Top Header -->
    <div class="top-bar">
      <div class="brand-title">TOCFL A1 • MANDARIN</div>
      <div class="mode-pills">
        <button class="pill-btn active" id="btn-mode-fc" onclick="switchMode('fc')">Kartu</button>
        <button class="pill-btn" id="btn-mode-qz" onclick="switchMode('qz')">Kuis</button>
      </div>
    </div>

    <!-- Progress Indicator -->
    <div class="progress-box">
      <div class="progress-info">
        <span id="progress-text">Kemajuan Pembelajaran</span>
        <span id="counter-text">1 / 20</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-bar"></div>
      </div>
    </div>

    <!-- FLASHCARD VIEW -->
    <div id="fc-screen" class="fc-screen">
      <div class="main-card" onclick="flipCard()">
        <div class="card-3d" id="card-3d">
          <div class="card-face card-front">
            <div class="hanzi-display" id="fc-hanzi">你好</div>
            <div class="tap-text">Ketuk untuk detail ➔</div>
          </div>
          <div class="card-face card-back">
            <div class="pinyin-display" id="fc-pinyin">nǐ hǎo</div>
            <div class="meaning-display" id="fc-meaning">Halo / Apa kabar</div>
          </div>
        </div>
      </div>

      <div class="controls-row">
        <button class="btn-nav" onclick="prevCard()">◄ Prev</button>
        <button class="btn-nav" style="border-color: var(--accent-purple);" onclick="randomCard()">🎲 Acak</button>
        <button class="btn-nav" onclick="nextCard()">Next ►</button>
      </div>
    </div>

    <!-- QUIZ VIEW -->
    <div id="qz-screen" class="qz-screen">
      <div id="qz-body">
        <div class="qz-question-card">
          <div class="qz-hanzi" id="qz-hanzi">你好</div>
        </div>
        <div class="qz-grid" id="qz-options"></div>
      </div>

      <div class="summary-card" id="qz-summary" style="display: none;">
        <div class="summary-score" id="qz-score-display"></div>
        <button class="btn-nav" style="width: 100%;" onclick="initQuiz()">Mulai Ulang Kuis</button>
      </div>
    </div>
  </div>

  <script>
    const dataset = [
      { hanzi: "你好", pinyin: "nǐ hǎo", meaning: "Halo / Apa kabar" },
      { hanzi: "謝謝", pinyin: "xiè xie", meaning: "Terima kasih" },
      { hanzi: "不客氣", pinyin: "bú kè qi", meaning: "Sama-sama" },
      { hanzi: "再見", pinyin: "zài jiàn", meaning: "Sampai jumpa" },
      { hanzi: "老師", pinyin: "lǎo shī", meaning: "Guru" },
      { hanzi: "學生", pinyin: "xué shēng", meaning: "Siswa / Murid" },
      { hanzi: "朋友", pinyin: "péng yǒu", meaning: "Teman" },
      { hanzi: "什麼", pinyin: "shén me", meaning: "Apa" },
      { hanzi: "名字", pinyin: "míng zi", meaning: "Nama" },
      { hanzi: "家", pinyin: "jiā", meaning: "Rumah / Keluarga" },
      { hanzi: "漂亮", pinyin: "piào liang", meaning: "Cantik / Indah" },
      { hanzi: "喜歡", pinyin: "xǐ huān", meaning: "Suka" },
      { hanzi: "喝茶", pinyin: "hē chá", meaning: "Minum teh" },
      { hanzi: "吃飯", pinyin: "chī fàn", meaning: "Makan nasi" },
      { hanzi: "買東西", pinyin: "mǎi dōng xi", meaning: "Berbelanja" },
      { hanzi: "多少錢", pinyin: "duō shǎo qián", meaning: "Berapa harga" },
      { hanzi: "今天", pinyin: "jīn tiān", meaning: "Hari ini" },
      { hanzi: "明天", pinyin: "míng tiān", meaning: "Besok" },
      { hanzi: "昨天", pinyin: "zuó tiān", meaning: "Kemarin" },
      { hanzi: "很高興", pinyin: "hěn gāo xìng", meaning: "Sangat senang" }
    ];

    let fcIndex = 0;
    let qzIdx = 0;
    let qzScore = 0;
    let qzList = [];
    let lockAnswer = false;

    // Flashcard Core
    function updateFC() {
      const item = dataset[fcIndex];
      document.getElementById('fc-hanzi').innerText = item.hanzi;
      document.getElementById('fc-pinyin').innerText = item.pinyin;
      document.getElementById('fc-meaning').innerText = item.meaning;
      document.getElementById('counter-text').innerText = `${fcIndex + 1} / ${dataset.length}`;
      
      const pct = ((fcIndex + 1) / dataset.length) * 100;
      document.getElementById('progress-bar').style.width = `${pct}%`;
      document.getElementById('card-3d').classList.remove('flipped');
    }

    function flipCard() {
      document.getElementById('card-3d').classList.toggle('flipped');
    }

    function nextCard() {
      fcIndex = (fcIndex + 1) % dataset.length;
      updateFC();
    }

    function prevCard() {
      fcIndex = (fcIndex - 1 + dataset.length) % dataset.length;
      updateFC();
    }

    function randomCard() {
      fcIndex = Math.floor(Math.random() * dataset.length);
      updateFC();
    }

    // Switch Screen
    function switchMode(mode) {
      if (mode === 'fc') {
        document.getElementById('fc-screen').style.display = 'block';
        document.getElementById('qz-screen').style.display = 'none';
        document.getElementById('btn-mode-fc').classList.add('active');
        document.getElementById('btn-mode-qz').classList.remove('active');
        document.getElementById('progress-text').innerText = 'Kemajuan Pembelajaran';
        updateFC();
      } else {
        document.getElementById('fc-screen').style.display = 'none';
        document.getElementById('qz-screen').style.display = 'block';
        document.getElementById('btn-mode-qz').classList.add('active');
        document.getElementById('btn-mode-fc').classList.remove('active');
        document.getElementById('progress-text').innerText = 'Progres Evaluasi';
        initQuiz();
      }
    }

    // Quiz Core
    function initQuiz() {
      qzList = [...dataset].sort(() => 0.5 - Math.random());
      qzIdx = 0;
      qzScore = 0;
      document.getElementById('qz-body').style.display = 'block';
      document.getElementById('qz-summary').style.display = 'none';
      renderQz();
    }

    function renderQz() {
      lockAnswer = false;
      const current = qzList[qzIdx];
      document.getElementById('qz-hanzi').innerText = current.hanzi;
      document.getElementById('counter-text').innerText = `${qzIdx + 1} / ${qzList.length}`;
      
      const pct = ((qzIdx + 1) / qzList.length) * 100;
      document.getElementById('progress-bar').style.width = `${pct}%`;

      const wrongOpts = dataset.filter(d => d.hanzi !== current.hanzi).sort(() => 0.5 - Math.random()).slice(0, 3);
      const options = [current, ...wrongOpts].sort(() => 0.5 - Math.random());

      const grid = document.getElementById('qz-options');
      grid.innerHTML = '';

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'qz-option-btn';
        btn.innerText = `${opt.pinyin} — ${opt.meaning}`;
        btn.onclick = () => checkQz(opt.hanzi === current.hanzi, btn);
        grid.appendChild(btn);
      });
    }

    function checkQz(isCorrect, target) {
      if (lockAnswer) return;
      lockAnswer = true;

      if (isCorrect) {
        target.classList.add('correct');
        qzScore++;
      } else {
        target.classList.add('wrong');
      }

      setTimeout(() => {
        qzIdx++;
        if (qzIdx < qzList.length) {
          renderQz();
        } else {
          document.getElementById('qz-body').style.display = 'none';
          document.getElementById('qz-summary').style.display = 'block';
          document.getElementById('qz-score-display').innerHTML = `Evaluasi Selesai!<br><br><span style="color: #fff;">Skor Akhir: ${qzScore} / ${qzList.length}</span>`;
        }
      }, 700);
    }

    updateFC();
  </script>
</body>
</html>
