<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Evaluasi Mandarin TOCFL Band A1</title>
  <style>
    :root {
      --primary-red: #8B0000;
      --accent-gold: #D4AF37;
      --bg-color: #2B0A0A;
      --surface-bg: #FFFFFF;
      --text-dark: #1A1A1A;
      --text-muted: #555555;
      --card-border: #E8D8B8;
      --success-green: #2E7D32;
      --error-red: #C62828;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #3A0D0D 0%, #1A0505 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: var(--text-dark);
    }

    .app-card {
      background: var(--surface-bg);
      border-top: 5px solid var(--accent-gold);
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 480px;
      padding: 28px 24px;
    }

    .app-header {
      text-align: center;
      border-bottom: 2px dashed #E0E0E0;
      padding-bottom: 16px;
      margin-bottom: 20px;
    }

    .app-header h1 {
      color: var(--primary-red);
      font-size: 22px;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .app-header p {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Tab Switcher */
    .tab-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: #F4F0EA;
      padding: 4px;
      border-radius: 8px;
      margin-bottom: 24px;
    }

    .tab-item {
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: transparent;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }

    .tab-item.active {
      background: var(--primary-red);
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(139, 0, 0, 0.3);
    }

    /* Flashcard View */
    .flashcard-wrapper {
      display: block;
    }

    .flashcard-box {
      width: 100%;
      height: 240px;
      perspective: 1000px;
      margin-bottom: 20px;
      cursor: pointer;
    }

    .flashcard-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s ease;
      border-radius: 12px;
    }

    .flashcard-inner.flipped {
      transform: rotateY(180deg);
    }

    .flashcard-side {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      border: 2px solid var(--card-border);
    }

    .flashcard-front {
      background: #FAF8F5;
      color: var(--primary-red);
    }

    .flashcard-back {
      background: #FFFFFF;
      transform: rotateY(180deg);
    }

    .hanzi-text {
      font-size: 68px;
      font-weight: 700;
      line-height: 1.1;
    }

    .click-hint {
      font-size: 11px;
      color: #999;
      margin-top: 15px;
      border: 1px solid #DDD;
      padding: 3px 10px;
      border-radius: 12px;
    }

    .pinyin-text {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary-red);
      margin-bottom: 10px;
    }

    .meaning-text {
      font-size: 15px;
      color: var(--text-dark);
      background: #F4F0EA;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 500;
    }

    .action-group {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--primary-red);
      background: #FFFFFF;
      color: var(--primary-red);
      font-weight: 600;
      font-size: 13px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: var(--primary-red);
      color: #FFFFFF;
    }

    .btn-action.gold {
      border-color: var(--accent-gold);
      color: #8A6D0B;
    }

    .btn-action.gold:hover {
      background: var(--accent-gold);
      color: #FFFFFF;
    }

    /* Quiz View */
    .quiz-wrapper {
      display: none;
    }

    .quiz-box {
      background: #FAF8F5;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      margin-bottom: 16px;
    }

    .quiz-hanzi {
      font-size: 56px;
      font-weight: 700;
      color: var(--primary-red);
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-option {
      padding: 12px 16px;
      border: 1px solid #E0E0E0;
      background: #FFFFFF;
      border-radius: 6px;
      font-size: 14px;
      text-align: left;
      font-weight: 500;
      color: var(--text-dark);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-option:hover {
      border-color: var(--primary-red);
      background: #FAF8F5;
    }

    .btn-option.correct {
      background: #E8F5E9;
      border-color: var(--success-green);
      color: var(--success-green);
      font-weight: 700;
    }

    .btn-option.wrong {
      background: #FFEBEE;
      border-color: var(--error-red);
      color: var(--error-red);
    }

    .result-box {
      text-align: center;
      padding: 20px 0;
    }

    .result-score {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary-red);
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="app-header">
      <h1>TOCFL Band A1 Mandarin</h1>
      <p>Modul Flashcard &amp; Evaluasi Akademik</p>
    </div>

    <!-- Navigation Tabs -->
    <div class="tab-container">
      <button class="tab-item active" id="tab-fc" onclick="setMode('fc')">Flashcard</button>
      <button class="tab-item" id="tab-qz" onclick="setMode('qz')">Evaluasi Kuis</button>
    </div>

    <!-- FLASHCARD MODE -->
    <div id="fc-mode" class="flashcard-wrapper">
      <div class="flashcard-box" onclick="toggleCard()">
        <div class="flashcard-inner" id="fc-inner">
          <div class="flashcard-side flashcard-front">
            <div class="hanzi-text" id="fc-hanzi">你好</div>
            <div class="click-hint">Klik untuk Membalik</div>
          </div>
          <div class="flashcard-side flashcard-back">
            <div class="pinyin-text" id="fc-pinyin">nǐ hǎo</div>
            <div class="meaning-text" id="fc-meaning">Halo / Apa kabar</div>
          </div>
        </div>
      </div>

      <div class="action-group">
        <button class="btn-action" onclick="prevCard()">Kembali</button>
        <button class="btn-action gold" onclick="randomCard()">Acak</button>
        <button class="btn-action" onclick="nextCard()">Lanjut</button>
      </div>
      <div style="text-align: center; font-size: 12px; color: #888; margin-top: 12px;" id="fc-counter">1 / 20</div>
    </div>

    <!-- QUIZ MODE -->
    <div id="qz-mode" class="quiz-wrapper">
      <div id="qz-content">
        <div class="quiz-box">
          <div style="font-size: 11px; color: #888; margin-bottom: 4px;" id="qz-progress">Soal 1 / 20</div>
          <div class="quiz-hanzi" id="qz-hanzi">你好</div>
        </div>

        <div class="options-list" id="qz-options"></div>
      </div>

      <div class="result-box" id="qz-result" style="display: none;">
        <div class="result-score" id="qz-score-text"></div>
        <button class="btn-action" onclick="initQuiz()">Ulangi Evaluasi</button>
      </div>
    </div>
  </div>

  <script>
    const dataList = [
      { hanzi: "你好", pinyin: "nǐ hǎo", meaning: "Halo / Apa kabar" },
      { hanzi: "謝謝", pinyin: "xiè xie", meaning: "Terima kasih" },
      { hanzi: "不客氣", pinyin: "bú kè qi", meaning: "Sama-sama" },
      { hanzi: "再見", pinyin: "zài jiàn", meaning: "Sampai jumpa" },
      { hanzi: "老師", pinyin: "lǎo shī", meaning: "Guru" },
      { hanzi: "學生", pinyin: "xué shēng", meaning: "Siswa / Murid" },
      { hanzi: "朋友", pinyin: "péng yǒu", meaning: "Teman" },
      { hanzi: "什麼", pinyin: "shén me", meaning: "Apa" },
      { hanzi: "名字", pinyin: "míng zi", meaning: "Nama" },
      { hanzi: "家", pinyin: "jiā", meaning: "Rumah / Keluarga" },
      { hanzi: "漂亮", pinyin: "piào liang", meaning: "Cantik / Indah" },
      { hanzi: "喜歡", pinyin: "xǐ huān", meaning: "Suka" },
      { hanzi: "喝茶", pinyin: "hē chá", meaning: "Minum teh" },
      { hanzi: "吃飯", pinyin: "chī fàn", meaning: "Makan nasi" },
      { hanzi: "買東西", pinyin: "mǎi dōng xi", meaning: "Berbelanja" },
      { hanzi: "多少錢", pinyin: "duō shǎo qián", meaning: "Berapa harga" },
      { hanzi: "今天", pinyin: "jīn tiān", meaning: "Hari ini" },
      { hanzi: "Wait...", pinyin: "míng tiān", meaning: "Besok" },
      { hanzi: "明天", pinyin: "míng tiān", meaning: "Besok" },
      { hanzi: "昨天", pinyin: "zuó tiān", meaning: "Kemarin" },
      { hanzi: "很高興", pinyin: "hěn gāo xìng", meaning: "Sangat senang" }
    ].filter(item => item.hanzi !== "Wait...");

    let cardIdx = 0;
    let quizIdx = 0;
    let quizScore = 0;
    let quizData = [];
    let isAnswering = false;

    // Flashcard Logic
    function renderCard() {
      const current = dataList[cardIdx];
      document.getElementById('fc-hanzi').innerText = current.hanzi;
      document.getElementById('fc-pinyin').innerText = current.pinyin;
      document.getElementById('fc-meaning').innerText = current.meaning;
      document.getElementById('fc-counter').innerText = `${cardIdx + 1} / ${dataList.length}`;
      document.getElementById('fc-inner').classList.remove('flipped');
    }

    function toggleCard() {
      document.getElementById('fc-inner').classList.toggle('flipped');
    }

    function nextCard() {
      cardIdx = (cardIdx + 1) % dataList.length;
      renderCard();
    }

    function prevCard() {
      cardIdx = (cardIdx - 1 + dataList.length) % dataList.length;
      renderCard();
    }

    function randomCard() {
      cardIdx = Math.floor(Math.random() * dataList.length);
      renderCard();
    }

    // Mode Switcher
    function setMode(mode) {
      if (mode === 'fc') {
        document.getElementById('fc-mode').style.display = 'block';
        document.getElementById('qz-mode').style.display = 'none';
        document.getElementById('tab-fc').classList.add('active');
        document.getElementById('tab-qz').classList.remove('active');
      } else {
        document.getElementById('fc-mode').style.display = 'none';
        document.getElementById('qz-mode').style.display = 'block';
        document.getElementById('tab-qz').classList.add('active');
        document.getElementById('tab-fc').classList.remove('active');
        initQuiz();
      }
    }

    // Quiz Logic
    function initQuiz() {
      quizData = [...dataList].sort(() => 0.5 - Math.random());
      quizIdx = 0;
      quizScore = 0;
      document.getElementById('qz-content').style.display = 'block';
      document.getElementById('qz-result').style.display = 'none';
      renderQuestion();
    }

    function renderQuestion() {
      isAnswering = true;
      const q = quizData[quizIdx];
      document.getElementById('qz-progress').innerText = `Soal ${quizIdx + 1} / ${quizData.length}`;
      document.getElementById('qz-hanzi').innerText = q.hanzi;

      const distractors = dataList.filter(d => d.hanzi !== q.hanzi).sort(() => 0.5 - Math.random()).slice(0, 3);
      const options = [q, ...distractors].sort(() => 0.5 - Math.random());

      const container = document.getElementById('qz-options');
      container.innerHTML = '';

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = `${opt.pinyin} — ${opt.meaning}`;
        btn.onclick = () => handleAnswer(opt.hanzi === q.hanzi, btn);
        container.appendChild(btn);
      });
    }

    function handleAnswer(isCorrect, btnElement) {
      if (!isAnswering) return;
      isAnswering = false;

      if (isCorrect) {
        btnElement.classList.add('correct');
        quizScore++;
      } else {
        btnElement.classList.add('wrong');
      }

      setTimeout(() => {
        quizIdx++;
        if (quizIdx < quizData.length) {
          renderQuestion();
        } else {
          document.getElementById('qz-content').style.display = 'none';
          document.getElementById('qz-result').style.display = 'block';
          document.getElementById('qz-score-text').innerHTML = `Evaluasi Selesai<br>Skor: ${quizScore} / ${quizData.length}`;
        }
      }, 800);
    }

    renderCard();
  </script>
</body>
</html>
